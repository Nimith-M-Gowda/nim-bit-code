embeddings:
  provider: openai # openai | huggingface
  model: text-embedding-3-small

chromadb:
  persist_dir: .nim-bit-code/chromadb/
  collection_name: codebase
  apikey: $CHROMA_API_KEY

elasticsearch:
  url: http://localhost:9200
  index_name: codebase

llm:
  provider: anthropic # openai | anthropic
  model: claude-haiku-4-5-20251001

rag:
  mode: hybrid # semantic | hybrid

vector_store:
  provider: qdrant
  retrieval_mode: hybrid # dense | sparse | hybrid

qdrant:
  collection_name: codebase-hybrid

memory:
  db_path: .nim-bit-code/memory/memory.db
  summarize_at_tokens: 2000
  keep_last_messages: 6
